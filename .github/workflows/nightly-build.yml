name: Build and Publish

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes (UTC)
  workflow_dispatch: {}

concurrency:
  group: build-and-publish
  cancel-in-progress: true

jobs:
  build_and_publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main (source)
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tornado markdown PyYAML python-dateutil requests nbconvert

      - name: Extract CSV URLs from semester_info.yaml
        working-directory: source
        id: csv_urls
        run: |
          python3 << 'EOF'
          import yaml
          import os
          
          with open('static/yaml/semester_info.yaml', 'r') as f:
              semester_info = yaml.safe_load(f)
          
          csv_urls = semester_info.get('csv_urls', {})
          resources_url = csv_urls.get('resources', '')
          schedule_url = csv_urls.get('schedule', '')
          
          # Output to GitHub Actions environment
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"resources_url={resources_url}\n")
              f.write(f"schedule_url={schedule_url}\n")
          EOF

      - name: Build site
        working-directory: source
        run: |
          mkdir -p static/csv
          curl -L -s "${{ steps.csv_urls.outputs.resources_url }}" -o static/csv/resources.csv
          curl -L -s "${{ steps.csv_urls.outputs.schedule_url }}" -o static/csv/schedule.csv
          make clean && make build

      - name: Checkout gh-pages (publish)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publish
          fetch-depth: 0

      - name: Sync built docs to gh-pages/docs
        run: |
          # Preserve existing CNAME from gh-pages if present
          mkdir -p publish/docs
          if [ -f publish/docs/CNAME ]; then cp publish/docs/CNAME /tmp/CNAME; fi
          if [ -f publish/CNAME ]; then cp publish/CNAME /tmp/CNAME; fi
          # Use CNAME from source if provided
          if [ -f source/CNAME ]; then cp source/CNAME /tmp/CNAME; fi
          if [ -f source/docs/CNAME ]; then cp source/docs/CNAME /tmp/CNAME; fi

          rsync -a --delete source/docs/ publish/docs/

          # Restore CNAME into both locations to satisfy GitHub Pages
          if [ -f /tmp/CNAME ]; then cp /tmp/CNAME publish/docs/CNAME; cp /tmp/CNAME publish/CNAME; fi

      - name: Commit and push to gh-pages
        working-directory: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if ! git diff --cached --quiet; then
            git commit -m "Automated build: refresh resources from CSV"
            git push origin gh-pages
          else
            echo "No changes to commit"
          fi
